<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌟 Book Recommendation System</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
      max-width: 480px;
      width: 90%;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 15px;
    }

    input {
      width: 80%;
      padding: 12px;
      border: 2px solid #66a6ff;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #00bcd4;
      background-color: #e0f7fa;
    }

    .hint {
      font-size: 0.9rem;
      color: #666;
      margin-top: 8px;
    }

    button {
      margin-top: 20px;
      background: linear-gradient(45deg, #ff6ec4, #7873f5);
      color: white;
      padding: 12px 30px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: linear-gradient(45deg, #ec008c, #fc6767);
    }

    ul {
      margin-top: 20px;
      list-style-type: none;
      padding: 0;
    }

    li {
      background: #f0f0f0;
      margin-bottom: 10px;
      padding: 10px;
      border-left: 5px solid #66a6ff;
      border-radius: 5px;
      text-align: left;
      font-size: 16px;
      color: #333;
    }

    .no-result {
      color: red;
      font-weight: bold;
      background-color: #ffe0e0;
      padding: 10px;
      border-radius: 5px;
    }

    .footer {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Book Recommender</h1>
    <input type="text" id="genreInput" placeholder="Enter book name (e.g., Sapiens)" />
    <div class="hint">Try: The Hobbit, Sapiens, 1984, Mistborn, Me Before You</div>
    <button onclick="recommendBooks()">Get Recommendation</button>
    <ul id="output"></ul>
    <div class="footer">Developed by Subikshan | DevOps Lab</div>
  </div>

  <script src="recommend.js"></script>
</body>
</html>
